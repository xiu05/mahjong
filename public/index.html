<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyonya's Table</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Ma+Shan+Zheng&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- hand-drawn wobble filter + tile symbols (filled by app.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
  </filter>
  <defs id="tileDefs"></defs>
</svg>

<main id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="card paper hero">
      <div class="stamp">麻雀</div>
      <h1>Nyonya's<br><span>Table</span></h1>
      <p class="sub">Four seats, one table. Play with friends online, bots fill any empty chair.</p>
      <label>Your name<input id="name" maxlength="14" placeholder="e.g. Ah Lian" autocomplete="off"></label>
      <div class="row">
        <button class="btn jade" id="btnCreate">Open a table</button>
      </div>
      <div class="or">— or join one —</div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.2em">
        <button class="btn rose" id="btnJoin">Join</button>
      </div>
      <p id="homeErr" class="err"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen" hidden>
    <div class="card paper">
      <h2>Table <span id="roomCode" class="code"></span></h2>
      <p class="sub">Share the code or link. Empty seats become bots when the host starts.</p>
      <div class="row"><button class="btn small" id="btnCopy">Copy invite link</button><button class="btn small ghost" id="btnLeave">Leave</button></div>
      <div id="seats" class="seatgrid"></div>
      <div class="row" id="hostRow">
        <button class="btn small" id="btnBot">+ Add bot</button>
        <button class="btn jade" id="btnStart">Start game</button>
      </div>
      <p id="waitHost" class="sub" hidden>Waiting for the host to start…</p>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header class="status paper">
      <div><b id="stHand"></b> <span id="stWall"></span></div>
      <div class="timer"><i id="timerBar"></i></div>
      <button class="btn tiny ghost" id="btnLeave2">Leave</button>
    </header>
    <div class="table">
      <div class="zone top" id="z2"></div>
      <div class="mid">
        <div class="zone left" id="z3"></div>
        <div class="compass" id="compass"></div>
        <div class="zone right" id="z1"></div>
      </div>
      <div class="zone me" id="z0"></div>
      <div class="burstflash" id="flash" hidden></div>
    </div>
    <div class="mine paper">
      <div id="actions" class="actions"></div>
      <div id="hint" class="hint"></div>
      <div id="hand" class="hand"></div>
    </div>
  </section>

  <div id="modal" class="modal" hidden><div class="card paper modalcard" id="modalBody"></div></div>
  <div id="toast" class="toast" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
